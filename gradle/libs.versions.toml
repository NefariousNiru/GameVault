# GameVault: pinned stable dependencies as of October 15, 2026.
# AGP is kept at the exact patch version from your working project.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
datastore = "1.2.1"
credentials = "1.6.0"
splashscreen = "1.2.0"
googleId = "1.1.1"
